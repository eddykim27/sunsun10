<script>
  var MODE = <?!= JSON.stringify(mode) ?>;         // 'admin' | 'view'
  var APP_URL = <?!= JSON.stringify(appUrl) ?>;
  var PIN_KEY = 'sunsun-admin-pin';
  // QR 주소 (Netlify 화면에서는 window.QR_BASE 로 바뀜)
  function qrUrl(i) { return window.QR_BASE ? window.QR_BASE + '/' + (i + 1) + '/' : APP_URL + '?s=' + (i + 1); }
  var STAFF_URL = window.STAFF_URL || (APP_URL + '?v=board');
  var PALETTE = ['#2F55D4', '#8A2BE2', '#D41FB0', '#E8930C', '#1B1B1B', '#0E8F82', '#C0392B', '#5D7C1E', '#7A4E2D', '#3A7BD5', '#9C27B0', '#00897B'];
  var PART_ORDER = ['오픈', '미들', '마감', '근무'];

  var S = {
    ym: null, data: null, pin: null,
    tab: 'cal',
    view: window.innerWidth < 760 ? 'list' : 'grid',
    statDate: null
  };

  /* ---------------- 유틸 ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toMin(s) { if (s == null || s === '') return null; var m = String(s).match(/(\d{1,2})(?::(\d{2}))?/); return m ? +m[1] * 60 + +(m[2] || 0) : null; }
  function fmt(n) { return n == null ? '' : Math.floor(n / 60) + ':' + pad(n % 60); }
  function hhmm(n) { return n == null ? '' : pad(Math.floor(n / 60)) + ':' + pad(n % 60); }
  function shortT(s) { var n = toMin(s); if (n == null) return ''; return n % 60 ? Math.floor(n / 60) + ':' + pad(n % 60) : String(n / 60); }
  function hm(min) { if (min == null) return '-'; var neg = min < 0; min = Math.abs(min); var h = Math.floor(min / 60), m = min % 60; return (neg ? '-' : '') + (h ? h + '시간' + (m ? ' ' : '') : '') + (m || !h ? m + '분' : ''); }
  function comma(n) { return n == null ? '-' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dObj(d) { return new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10), 12); }
  function dStr(o) { return o.getFullYear() + '-' + pad(o.getMonth() + 1) + '-' + pad(o.getDate()); }
  function addDays(d, n) { var o = dObj(d); o.setDate(o.getDate() + n); return dStr(o); }
  function stLabel(w) { return w.late > 0 ? w.status.replace('지각', '지각 ' + w.late + '분') : w.status; }
  function dow(d) { return dObj(d).getDay(); }
  function shiftYm(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad(m + 1); }
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 2800); }
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function stClass(s) {
    s = s || '';
    var order = ['결근', '지각', '조퇴', '출근누락', '퇴근누락', '미출근', '휴게중', '근무중', '정상', '스케줄외', '예정', '기록전'];
    for (var i = 0; i < order.length; i++) if (s.indexOf(order[i]) >= 0) return 'st-' + order[i];
    return 'st-예정';
  }
  function attDot(s) {
    if (!s) return '';
    if (/결근|지각|조퇴|출근누락/.test(s)) return 'bad';
    if (/퇴근누락|미출근/.test(s)) return 'warn';
    if (/근무중|휴게중/.test(s)) return 'info';
    if (/정상/.test(s)) return 'ok';
    return '';
  }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      r[fn].apply(r, args);
    });
  }

  /* ---------------- 데이터 해석 ---------------- */
  function staffInfo(name) {
    var list = S.data.staff, i = 0;
    for (; i < list.length; i++) if (list[i].name === name) break;
    var s = list[i] || { name: name, type: '알바', color: '' };
    if (!s.color) s.color = s.type === '직원' ? '#2B4A39' : PALETTE[i % PALETTE.length];
    return s;
  }
  function dayType(d) {
    var w = dow(d);
    if (w === 0) return '일요일';
    if (w === 6 || S.data.holidays[d]) return '토·공휴일';
    return '평일';
  }
  function defaults(store, d) { return S.data.hours.filter(function (h) { return h.store === store && h.dayType === dayType(d); }); }
  /** 기본 휴무일(토·일 등)에 근무를 넣을 때 쓸 시간: 그날 기본시간 → 없으면 토·공휴일 → 평일 순서로 */
  function addDefaults(store, d) {
    var list = defaults(store, d);
    ['토·공휴일', '평일'].forEach(function (t) {
      if (!list.length) list = S.data.hours.filter(function (h) { return h.store === store && h.dayType === t; });
    });
    return list;
  }
  function defaultFor(store, d, part) { var x = addDefaults(store, d).filter(function (h) { return h.part === part; })[0]; return x || null; }
  function partsOf(store) {
    var p = [];
    S.data.hours.forEach(function (h) { if (h.store === store && p.indexOf(h.part) < 0) p.push(h.part); });
    p.sort(function (a, b) { return idxPart(a) - idxPart(b); });
    ['근무', '기타'].forEach(function (x) { if (p.indexOf(x) < 0) p.push(x); });
    return p;
  }
  function idxPart(p) { var i = PART_ORDER.indexOf(p); return i < 0 ? 99 : i; }
  function shiftsOn(d, store) { return S.data.schedule.filter(function (s) { return s.date === d && (!store || s.store === store); }); }
  function memosOn(d, pos) { return S.data.memos.filter(function (m) { return m.date === d && (!pos || m.pos === pos); }); }
  function workOn(d, store, name) {
    if (!S.data.work) return null;
    return S.data.work.filter(function (w) { return w.date === d && w.store === store && w.name === name; })[0] || null;
  }
  function storeCls(i) { return 's' + (i + 1); }
  function storeLabel(st) { return st.name + (st.area ? '(' + st.area + ')' : ''); }

  /* ---------------- 시작 ---------------- */
  function boot() {
    var p = new URLSearchParams(location.search);
    S.ym = p.get('ym') || null;
    if (MODE === 'admin') {
      S.pin = ss(PIN_KEY);
      if (!S.pin) return renderLogin();
    }
    load(S.ym);
  }

  function renderLogin(msg) {
    $('root').innerHTML = '<div class="login"><div class="logo-box"><div class="logo"><span>SUN</span><span>SUN</span><span>COFFEE</span></div></div>' +
      '<b style="font-size:18px">스케줄 관리자</b><input id="pin" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password">' +
      (msg ? '<div style="color:var(--late);font-size:13px">' + esc(msg) + '</div>' : '') +
      '<button class="btn primary" id="login-btn" style="justify-content:center;padding:12px">들어가기</button></div>';
    var go = function () {
      var v = $('pin').value.trim(); if (!v) return;
      $('login-btn').disabled = true;
      api('adminLogin', v).then(function () { S.pin = v; ss(PIN_KEY, v); load(S.ym); })
        .catch(function (e) { renderLogin(e.message || '비밀번호가 맞지 않아요'); });
    };
    $('login-btn').onclick = go;
    $('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    $('pin').focus();
  }

  function load(ym) {
    if (!S.data) $('root').innerHTML = '<div class="center"><div class="spinner"></div></div>';
    return api('getMonthData', ym || '', MODE === 'admin' ? S.pin : '').then(function (d) {
      setData(d);
    }).catch(function (e) {
      if (MODE === 'admin' && /비밀번호/.test(e.message || '')) { ss(PIN_KEY, null); return renderLogin(e.message); }
      toast(e.message || String(e), true);
      if (!S.data) $('root').innerHTML = '<div class="center" style="color:var(--late)">' + esc(e.message || e) + '</div>';
    });
  }

  /* ---------------- 임시 저장(초안) ---------------- */
  // 날짜별 수정 내용을 화면에만 먼저 반영하고, [시트에 저장]을 누를 때 한 번에 올림
  var DRAFT_KEY = 'sunsun-drafts';
  S.drafts = {};
  try { S.drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}') || {}; } catch (e) { S.drafts = {}; }
  function persistDrafts() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(S.drafts)); } catch (e) {} }
  function draftCount() { return Object.keys(S.drafts).length; }
  function applyDrafts(d) {
    Object.keys(S.drafts).forEach(function (date) {
      if (date < d.from || date > d.to) return;
      var dr = S.drafts[date];
      d.schedule = d.schedule.filter(function (x) { return x.date !== date; })
        .concat(dr.shifts.map(function (x) { return { date: date, store: x.store, name: x.name, part: x.part, start: x.start, end: x.end, memo: x.memo || '' }; }));
      d.memos = d.memos.filter(function (x) { return x.date !== date; })
        .concat(dr.memos.map(function (x) { return { date: date, pos: x.pos, text: x.text }; }));
    });
  }
  function pushDrafts() {
    var dates = Object.keys(S.drafts).sort();
    if (!dates.length) return Promise.resolve();
    var btn = $('draft-save'); if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
    toast(dates.length + '일치 스케줄을 시트에 저장하는 중…');
    var days = dates.map(function (dt) { return { date: dt, shifts: S.drafts[dt].shifts, memos: S.drafts[dt].memos }; });
    return api('saveDays', S.pin, days, S.ym).then(function (d) {
      S.drafts = {}; persistDrafts(); setData(d);
      toast('시트에 저장했어요 · 출퇴근 기준에 반영됐어요');
    }).catch(function (e) {
      toast(e.message || String(e), true);
      if (btn) { btn.disabled = false; btn.textContent = '☁ 시트에 저장'; }
      throw e;
    });
  }
  function discardDrafts() {
    if (!confirm('저장하지 않은 변경 ' + draftCount() + '일을 모두 취소할까요?')) return;
    S.drafts = {}; persistDrafts(); load(S.ym); toast('변경을 취소했어요');
  }
  /** 저장 안 된 변경이 있으면 먼저 시트에 올리고 나서 fn 실행 */
  function withFlush(fn) { if (!draftCount()) return fn(); pushDrafts().then(fn, function () {}); }
  window.addEventListener('beforeunload', function (e) { if (MODE === 'admin' && draftCount()) { e.preventDefault(); e.returnValue = ''; } });

  function draftBar() {
    var n = draftCount();
    if (MODE !== 'admin' || !n) return '';
    var ds = Object.keys(S.drafts).sort().map(function (x) { return (+x.slice(5, 7)) + '/' + (+x.slice(8)); });
    return '<div class="draft-bar no-print"><div><b>저장 안 된 변경 ' + n + '일</b><small>' + esc(ds.slice(0, 12).join(', ') + (ds.length > 12 ? ' …' : '')) +
      ' · 다 짜고 [시트에 저장]을 눌러야 출퇴근 기준에 반영돼요</small></div>' +
      '<div class="draft-btns"><button class="btn ghost" onclick="discardDrafts()">취소</button><button class="btn orange" id="draft-save" onclick="pushDrafts()">☁ 시트에 저장</button></div></div>';
  }

  function setData(d) {
    if (MODE === 'admin') applyDrafts(d);
    S.data = d; S.ym = d.ym;
    if (!S.statDate || S.statDate.slice(0, 7) !== d.ym) S.statDate = d.today.slice(0, 7) === d.ym ? d.today : d.ym + '-01';
    render();
  }

  /* ---------------- 렌더 ---------------- */
  function render() {
    var d = S.data, y = d.ym.slice(2, 4), m = +d.ym.slice(5, 7);
    var h = '<div class="wrap">';
    h += '<div class="head"><div class="brand"><div class="logo-box">' +
      (d.logoUrl ? '<img class="logo-img" src="' + esc(d.logoUrl) + '" alt="">' : '<div class="logo"><span>SUN</span><span>SUN</span><span>COFFEE</span></div>') +
      '</div><h1>SUNSUNCOFFEE<br>SCHEDULE<small class="no-print">' + (MODE === 'admin' ? '관리자 · 다 짠 뒤 [시트에 저장]을 누르면 반영돼요' : '직원용 스케줄표') + '</small></h1></div>' +
      '<div class="month-nav"><button class="round" onclick="go(-1)" aria-label="이전 달">‹</button><div class="m">' + y + '<span>년</span> ' + m + '<span>월</span></div><button class="round" onclick="go(1)" aria-label="다음 달">›</button></div></div>';

    h += draftBar();
    h += '<div class="toolbar no-print">';
    if (MODE === 'admin') {
      h += '<div class="tabs">' + [['cal', '스케줄'], ['sum', '근무시간 합계'], ['att', '출퇴근 현황'], ['set', 'QR · 설정']].map(function (t) {
        return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
      }).join('') + '</div>';
    } else { h += '<div></div>'; }
    if (S.tab === 'cal') {
      h += '<div class="tools"><div class="seg"><button class="' + (S.view === 'grid' ? 'on' : '') + '" onclick="setView(\'grid\')">달력</button><button class="' + (S.view === 'list' ? 'on' : '') + '" onclick="setView(\'list\')">목록</button></div>' +
        (MODE === 'admin' ? '<button class="btn" onclick="openCopy()">⧉ 주 복사</button>' : '') +
        '<button class="btn" onclick="doPrint()">🖨 인쇄·PDF</button><button class="btn" onclick="saveImage()">🖼 이미지</button></div>';
    }
    h += '</div>';

    if (S.tab === 'cal') h += rulesHtml() + '<div class="sheet-card" id="capture">' + (S.view === 'grid' ? gridHtml() : listHtml()) + '</div>';
    if (S.tab === 'sum') h += sumHtml();
    if (S.tab === 'att') h += attHtml();
    if (S.tab === 'set') h += setHtml();
    h += '</div>';
    $('root').innerHTML = h;
    if (S.tab === 'set') drawQr();
    // 목록 보기는 처음 열 때 오늘 날짜로 스크롤
    if (S.tab === 'cal' && S.view === 'list' && !S.scrolled && S.data.today.slice(0, 7) === S.ym) {
      S.scrolled = true;
      var el = $('day-' + S.data.today);
      if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -10); }, 50);
    }
  }

  function rulesHtml() {
    var d = S.data, h = '<div class="rules">';
    d.stores.forEach(function (st) {
      var lines = [];
      ['평일', '토·공휴일', '일요일'].forEach(function (t) {
        var hs = d.hours.filter(function (x) { return x.store === st.name && x.dayType === t; });
        var label = t === '평일' ? '월~금' : t === '토·공휴일' ? '토요일·공휴일' : '주일';
        if (!hs.length) lines.push(label + ' : 휴무');
        else lines.push(label + ' : ' + hs.map(function (x) { return (x.part === '근무' ? '' : x.part + ') ') + x.start + '~' + x.end; }).join(' / '));
      });
      h += '<div class="rule"><b>[ ' + esc(st.name) + (st.area ? ' · ' + esc(st.area) : '') + ' ] 근무시간</b><br>' + lines.map(esc).join('<br>') +
        (st.memo ? '<br>' + esc(st.memo) : '') + '</div>';
    });
    h += '</div><div class="rule" style="padding:8px 14px"><div class="note" style="margin:0">* 근무시작 ' + d.prep.staff + '분 전 출근 및 준비시작 (파트타임은 ' + d.prep.part + '분 전까지 출근)</div></div>';
    return h;
  }

  /** 하루 칸 내용 */
  function dayInner(d, listMode) {
    var data = S.data, w = dow(d), hol = data.holidays[d];
    var top = memosOn(d, '상단').map(function (m) { return m.text; }).join(', ');
    var h = '<div class="cell-top">' + (hol ? '<span class="hol">' + esc(hol) + '</span>' : '') +
      (top ? '<span class="note">' + esc(top) + '</span>' : '') +
      '<span class="d ' + (w === 0 || hol ? 'sun' : w === 6 ? 'sat' : '') + '">' + (listMode ? (+d.slice(5, 7)) + '/' + (+d.slice(8)) + ' ' + '일월화수목금토'[w] : +d.slice(8)) + '</span></div>';
    var blocks = '';
    data.stores.forEach(function (st, i) {
      var sh = shiftsOn(d, st.name);
      var sm = memosOn(d, st.name);
      var b = '<div class="st-block"><div class="st-title ' + storeCls(i) + (sh.length ? '' : ' off') + '">' + esc(storeLabel(st)) + '</div>';
      if (!sh.length) {
        b += '<div class="st-closed">휴무</div>';
      } else {
        var byPart = {};
        sh.forEach(function (s) { (byPart[s.part] = byPart[s.part] || []).push(s); });
        var parts = Object.keys(byPart).sort(function (a, b2) { return idxPart(a) - idxPart(b2); });
        parts.forEach(function (p) {
          var names = byPart[p].map(function (s) {
            var info = staffInfo(s.name), def = defaultFor(st.name, d, p);
            var custom = !def || def.start !== s.start || def.end !== s.end;
            var wk = workOn(d, st.name, s.name);
            var dot = wk && d <= data.today ? attDot(wk.status) : '';
            return '<span class="nm" style="color:' + info.color + '">' + esc(s.name) + (custom ? '<span class="tm">(' + shortT(s.start) + '-' + shortT(s.end) + ')</span>' : '') + '</span>' +
              (dot ? '<i class="att ' + dot + '" title="' + esc(wk.status) + '"></i>' : '');
          }).join(', ');
          b += '<div class="line">' + (p === '근무' ? '' : '<span class="part">' + esc(p) + ' : </span>') + names + '</div>';
        });
      }
      sm.forEach(function (m) { b += '<div class="line smemo">' + esc(m.text) + '</div>'; });
      blocks += b + '</div>';
    });
    h += listMode ? '<div class="stores-2">' + blocks + '</div>' : blocks;
    memosOn(d, '하단').forEach(function (m) { h += '<div class="bmemo">' + esc(m.text) + '</div>'; });
    return h;
  }

  function cellClass(d, inMonth) {
    var w = dow(d), c = 'cell';
    if (!inMonth) c += ' out';
    if (w === 4) c += ' thu';
    if (d === S.data.today) c += ' today';
    if (MODE === 'admin') c += ' editable';
    if (MODE === 'admin' && S.drafts[d]) c += ' dirty';
    return c;
  }

  function gridHtml() {
    var d = S.data, h = '<div class="cal-scroll"><div class="cal">';
    ['주일', '월', '화', '수', '목', '금', '토'].forEach(function (n, i) { h += '<div class="dh ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + n + '</div>'; });
    for (var x = d.from; x <= d.to; x = addDays(x, 1)) {
      var inM = x.slice(0, 7) === d.ym;
      h += '<div class="' + cellClass(x, inM) + '"' + (MODE === 'admin' ? ' onclick="openDay(\'' + x + '\')"' : '') + '>' + (inM ? dayInner(x, false) : '<div class="cell-top"><span class="d">' + (+x.slice(5, 7)) + '/' + (+x.slice(8)) + '</span></div>') + '</div>';
    }
    return h + '</div></div>' + (MODE === 'admin' ? '<div class="hint no-print">칸을 누르면 그날 스케줄을 고칠 수 있어요. 이름 옆 점: <i class="att ok"></i> 정상 <i class="att bad"></i> 지각·결근 <i class="att warn"></i> 퇴근누락 <i class="att info"></i> 근무중 · 주황 시간 표시는 기본 시간과 다른 근무</div>' : '');
  }

  function listHtml() {
    var d = S.data, h = '<div class="list">';
    var days = [];
    for (var x = d.from; x <= d.to; x = addDays(x, 1)) if (x.slice(0, 7) === d.ym) days.push(x);
    // 직원 보기에서는 오늘부터 보여주기 (지난 날은 접기)
    days.forEach(function (x) {
      if (dow(x) === 0 || x === days[0]) h += '<div class="week-sep">' + (+x.slice(5, 7)) + '/' + (+x.slice(8)) + ' 주</div>';
      h += '<div class="' + cellClass(x, true) + ' listmode" id="day-' + x + '"' + (MODE === 'admin' ? ' onclick="openDay(\'' + x + '\')"' : '') + '>' + dayInner(x, true) + '</div>';
    });
    return h + '</div>';
  }

  /* ---------------- 근무시간 합계 ---------------- */
  function weeksOf() {
    var d = S.data, weeks = [];
    for (var s = d.from; s <= d.to; s = addDays(s, 7)) weeks.push({ from: s, to: addDays(s, 6) });
    return weeks;
  }
  function plannedMin(s) { var a = toMin(s.start), b = toMin(s.end); return a != null && b != null && b > a ? b - a : 0; }
  /** 한 사람의 스케줄 목록 → 휴게(알바 5시간 이상 30분, 7시간 이상 1시간) 뺀 근무 분 */
  function netMinutes(list, name) {
    var isPart = staffInfo(name).type !== '직원', brk = S.data.brk || { at30: 300, at60: 420 }, byDay = {};
    var cap = {}; S.data.stores.forEach(function (st) { if (st.breakCap != null) cap[st.name] = st.breakCap; else if (st.noBreak) cap[st.name] = 0; });
    list.forEach(function (s) { var k = s.date + '|' + s.store; byDay[k] = (byDay[k] || 0) + plannedMin(s); });
    return Object.keys(byDay).reduce(function (a, k) {
      var m = byDay[k], store = k.split('|')[1];
      var b = isPart ? (m >= brk.at60 ? 60 : m >= brk.at30 ? 30 : 0) : 0;
      if (cap[store] != null) b = Math.min(b, cap[store]);
      return a + m - b;
    }, 0);
  }

  function sumHtml() {
    var d = S.data, weeks = weeksOf();
    var names = d.staff.filter(function (s) { return s.status !== '퇴사' || d.schedule.some(function (x) { return x.name === s.name; }); }).map(function (s) { return s.name; });
    d.schedule.forEach(function (s) { if (names.indexOf(s.name) < 0) names.push(s.name); });
    var rows = names.map(function (n) {
      var info = staffInfo(n);
      var wk = weeks.map(function (w) {
        return netMinutes(d.schedule.filter(function (s) { return s.name === n && s.date >= w.from && s.date <= w.to; }), n);
      });
      var mine = d.schedule.filter(function (s) { return s.name === n && s.date.slice(0, 7) === d.ym; });
      var month = netMinutes(mine, n);
      var days = {}; mine.forEach(function (s) { days[s.date] = 1; });
      var works = (d.work || []).filter(function (w) { return w.name === n && w.date.slice(0, 7) === d.ym; });
      var done = works.filter(function (w) { return w.actual != null; });
      var actual = done.reduce(function (a, w) { return a + w.actual; }, 0);
      var donePlanned = done.reduce(function (a, w) { return a + (w.planned || 0); }, 0);
      var late = works.filter(function (w) { return /지각/.test(w.status); }).length;
      var absent = works.filter(function (w) { return /결근/.test(w.status); }).length;
      return { name: n, type: info.type, color: info.color, wk: wk, month: month, days: Object.keys(days).length, actual: actual, late: late, absent: absent, hasWork: done.length > 0, donePlanned: donePlanned };
    });
    var h = '<div class="sheet-card"><h3 class="sec">근무시간 합계 <small>스케줄 기준 예정 근무시간 · 알바는 근무 5시간 이상이면 휴게 30분, 7시간 이상이면 1시간 제외 (1호점처럼 휴게 최대치가 있는 지점은 그만큼까지만) · 주는 일~토</small></h3><div class="tbl-scroll"><table class="t"><thead><tr><th>이름</th>';
    weeks.forEach(function (w, i) { h += '<th>' + (i + 1) + '주<span class="sub" style="display:block;font-weight:500">' + (+w.from.slice(5, 7)) + '/' + (+w.from.slice(8)) + '~' + (+w.to.slice(5, 7)) + '/' + (+w.to.slice(8)) + '</span></th>'; });
    h += '<th>' + (+d.ym.slice(5)) + '월 합계</th><th>근무일</th><th>실제 근무</th><th>차이*</th><th>지각</th><th>결근</th></tr></thead><tbody>';
    ['직원', '알바'].forEach(function (type) {
      var rs = rows.filter(function (r) { return r.type === type; });

        tot.month += r.month; tot.actual += r.actual;

          '<td class="num ' + (diff < 0 ? 'neg' : diff > 0 ? 'pos' : '') + '">' + (diff == null ? '-' : (diff > 0 ? '+' : '') + comma(diff) + '분') + '</td>' +
          '<td class="num' + (r.late ? ' neg' : '') + '">' + (r.late || '-') + '</td><td class="num' + (r.absent ? ' neg' : '') + '">' + (r.absent || '-') + '</td></tr>';
      });

        '<td class="num big">' + comma(tot.month) + '분<span class="sub">' + hm(tot.month) + '</span></td><td></td><td class="num">' + comma(tot.actual) + '분</td><td colspan="3"></td></tr>';
    });
    h += '</tbody></table></div><div class="hint">주 합계는 달이 걸친 주도 일~토 전체를 셉니다. 월 합계·실제 근무는 이번 달 날짜만 셉니다. 실제 근무 = 퇴근 − 출근 (출·퇴근이 모두 찍힌 날만). *차이 = 실제 근무 − 그날들의 예정 시간.</div></div>';
    return h;
  }

  /* ---------------- 출퇴근 현황 ---------------- */

    var works = (d.work || []).filter(function (w) { return w.date.slice(0, 7) === d.ym; });

    var h = '<div class="sheet-card"><h3 class="sec">' + (+d.ym.slice(5)) + '월 출퇴근 요약 <small>' + esc(d.startDate || '') + '부터 판정</small></h3><div class="stat-grid">' +
      [['정상', /정상/], ['지각', /지각/], ['결근', /결근/], ['퇴근누락', /퇴근누락/], ['스케줄외 출근', /스케줄외/]].map(function (x) {
        return '<div class="stat"><small>' + x[0] + '</small><b>' + count(x[1]) + '</b></div>';

      return '<option value="' + x + '"' + (x === S.statDate ? ' selected' : '') + '>' + (+x.slice(5, 7)) + '/' + (+x.slice(8)) + ' (' + '일월화수목금토'[dow(x)] + ')' + (x === d.today ? ' 오늘' : '') + '</option>';
    }).join('') + '</select><button class="btn" onclick="openDay(S.statDate)">이 날 수정</button></div>';

    d.stores.forEach(function (st, i) {
      var list = (d.work || []).filter(function (w) { return w.date === S.statDate && w.store === st.name; });
      var dayOff = !shiftsOn(S.statDate, st.name).length;
      h += '<h4 style="margin:12px 0 4px" class="st-title ' + storeCls(i) + (dayOff ? ' off' : '') + '">' + esc(storeLabel(st)) + '</h4><div class="day-list">';
      if (!list.length) h += '<div class="hint">기록·스케줄 없음</div>';
      list.forEach(function (w) {
        h += '<div class="dl-row"><b style="color:' + staffInfo(w.name).color + '">' + esc(w.name) + '</b><span class="st">' + esc(w.parts || '-') + '</span>' +
          '<span class="when num">' + (w.planned ? '예정 ' + w.start + '–' + w.end : '스케줄 없음') + '<br>' + (w.tin || w.tout ? '실제 ' + (w.tin || '?') + '–' + (w.tout || '?') : '기록 없음') +  + '</span>' +
          '<span class="pill ' + stClass(w.status) + '">' + esc(stLabel(w)) + '</span></div>';
      });
      h += '</div>';
    });

    // 사람별 이번 달 요약
    var byName = {};
    works.forEach(function (w) {
      var o = byName[w.name] = byName[w.name] || { late: 0, lateMin: 0, absent: 0, miss: 0, extra: 0 };
      if (/지각/.test(w.status)) { o.late++; o.lateMin += w.late; }
      if (/결근/.test(w.status)) o.absent++;
      if (/퇴근누락|출근누락/.test(w.status)) o.miss++;
      if (/스케줄외/.test(w.status)) o.extra++;
    });
    h += '<h3 class="sec" style="margin-top:22px">사람별 <small>이번 달</small></h3><div class="tbl-scroll"><table class="t"><thead><tr><th>이름</th><th>지각</th><th>늦은 시간</th><th>결근</th><th>기록누락</th><th>스케줄외</th></tr></thead><tbody>';
    Object.keys(byName).sort().forEach(function (n) {
      var o = byName[n];
      h += '<tr><td><b style="color:' + staffInfo(n).color + '">' + esc(n) + '</b></td><td class="num' + (o.late ? ' neg' : '') + '">' + o.late + '회</td><td class="num">' + (o.lateMin ? o.lateMin + '분' : '-') + '</td><td class="num' + (o.absent ? ' neg' : '') + '">' + o.absent + '</td><td class="num">' + o.miss + '</td><td class="num">' + o.extra + '</td></tr>';

    return h;
  }

  /* ---------------- QR · 설정 ---------------- */
  function setHtml() {
    var d = S.data, h = '<div class="sheet-card"><h3 class="sec">매장 QR 코드 <small>인쇄해서 매장에 붙여주세요</small></h3><div class="qr-grid">';
    d.stores.forEach(function (st, i) {
      var url = qrUrl(i);
      h += '<div class="qr-card"><div class="logo-box" style="width:70px;height:70px"><div class="logo" style="font-size:16px"><span>SUN</span><span>SUN</span><span>COFFEE</span></div></div><h4>' + esc(storeLabel(st)) + ' 출퇴근</h4>' +
        '<div class="qr" id="qr-' + i + '"></div><div class="url">' + esc(url) + '</div>' +
        '<div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><a class="btn" href="' + esc(url) + '" target="_blank">열어보기</a>' +

        '<div class="hint">' + (st.hasLocation ? '위치 등록됨 · 반경 안에서만 출퇴근 가능' : '아직 위치 미등록 → 위치 확인 없이 기록돼요') + '</div></div>';
    });
    h += '</div><div class="no-print" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="window.print()">🖨 QR 인쇄</button>' +
      '<a class="btn" href="' + esc(STAFF_URL) + '" target="_blank">출퇴근 대시보드 열기</a><button class="btn" onclick="copyText(STAFF_URL)">대시보드 주소 복사</button>' +
      '<button class="btn ghost" onclick="logout()">로그아웃</button></div>' +
      '<div class="hint" style="margin-top:12px">📍 위치 등록은 <b>해당 매장 안에서</b> 휴대폰으로 눌러주세요. 관리자 비밀번호·지각 기준·허용 반경·직원 목록·기본 근무시간은 구글 시트의 [설정]·[직원]·[기본근무시간] 탭에서 바꿀 수 있어요.</div></div>';
    return h;
  }

  function drawQr() {
    if (typeof QRCode === 'undefined') return;
    S.data.stores.forEach(function (st, i) {
      var el = $('qr-' + i); if (!el) return;
      el.innerHTML = '';
      new QRCode(el, { text: qrUrl(i), width: 200, height: 200, colorDark: '#174D2E', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    });
  }

  function setLoc(store) {
    if (!navigator.geolocation) return toast('이 기기에서는 위치를 확인할 수 없어요.', true);
    if (!confirm(store + ' 안에 있나요?\n지금 위치를 ' + store + ' 위치로 등록할게요.')) return;
    toast('위치 확인 중…');
    navigator.geolocation.getCurrentPosition(function (p) {
      api('setStoreLocation', S.pin, store, p.coords.latitude, p.coords.longitude).then(function () {
        toast(store + ' 위치를 등록했어요 (오차 ' + Math.round(p.coords.accuracy) + 'm)'); load(S.ym);
      }).catch(function (e) { toast(e.message, true); });
    }, function () { toast('위치 권한을 허용해주세요.', true); }, { enableHighAccuracy: true, timeout: 15000 });
  }

  function copyText(t) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('주소를 복사했어요'); }, function () { prompt('주소를 복사하세요', t); });
  }
  function logout() { ss(PIN_KEY, null); S.pin = null; S.data = null; renderLogin(); }

  /* ---------------- 하루 편집 ---------------- */
  var ED = null;

  function openDay(d) {
    if (MODE !== 'admin') return;
    var data = S.data;
    ED = {
      date: d,
      holiday: !!data.holidays[d],
      holidayName: data.holidays[d] || '',
      shifts: shiftsOn(d).map(function (s) { return { store: s.store, name: s.name, part: s.part, start: s.start, end: s.end, memo: s.memo || '' }; }),
      top: memosOn(d, '상단').map(function (m) { return m.text; }).join('\n'),
      bottom: memosOn(d, '하단').map(function (m) { return m.text; }).join('\n'),
      storeMemo: {}
    };
    data.stores.forEach(function (st) { ED.storeMemo[st.name] = memosOn(d, st.name).map(function (m) { return m.text; }).join('\n'); });
    drawEditor();
    $('overlay').classList.add('show');
  }

  function closeEd() { $('overlay').classList.remove('show'); ED = null; }

  function drawEditor() {
    var d = ED.date, data = S.data, w = dow(d);
    var h = '<div class="panel-head"><h2>' + (+d.slice(5, 7)) + '월 ' + (+d.slice(8)) + '일 (' + '일월화수목금토'[w] + ')<small>' + dayType(d) + (data.holidays[d] ? ' · ' + esc(data.holidays[d]) : '') + '</small></h2>' +
      '<button class="round" onclick="closeEd()" aria-label="닫기">✕</button></div>';

    data.stores.forEach(function (st, i) {
      var defs = defaults(st.name, d), addDefs = addDefaults(st.name, d);
      var mine = ED.shifts.map(function (s, idx) { return { s: s, idx: idx }; }).filter(function (x) { return x.s.store === st.name; });
      h += '<div class="box"><h4><span class="' + storeCls(i) + '">' + esc(storeLabel(st)) + '</span><small>' +
        (defs.length ? defs.map(function (x) { return (x.part === '근무' ? '' : x.part + ' ') + shortT(x.start) + '-' + shortT(x.end); }).join(' · ') : '기본 휴무일 · 근무 추가 가능') + '</small></h4>';
      if (!mine.length) h += '<div class="hint" style="margin:0 0 6px">근무자 없음 → 휴무로 표시돼요' + (defs.length ? '' : ' · 근무가 있으면 아래 버튼으로 추가하세요 (시간은 바꿀 수 있어요)') + '</div>';
      mine.forEach(function (x) { h += shiftRow(x.s, x.idx, st.name); });
      h += '<div class="add-row">';
      (addDefs.length ? addDefs.map(function (x) { return x.part; }) : ['근무']).forEach(function (p) {
        h += '<button onclick="addShift(\'' + esc(st.name) + '\',\'' + esc(p) + '\')">+ ' + esc(p) + '</button>';
      });
      h += '</div><div class="fld" style="margin-top:10px"><label>' + esc(st.name) + ' 메모 (예: 예배 : 경동, 컴패션(부산) : 하윤) · 줄마다 한 개</label><textarea rows="1" oninput="ED.storeMemo[\'' + esc(st.name) + '\']=this.value">' + esc(ED.storeMemo[st.name]) + '</textarea></div></div>';
    });

    h += '<div class="box"><h4>날짜 메모</h4>' +
      '<div class="fld"><label>위쪽 메모 (날짜 옆, 예: 피스대청소)</label><textarea rows="1" oninput="ED.top=this.value">' + esc(ED.top) + '</textarea></div>' +
      '<div class="fld"><label>아래쪽 메모 (예: *코스트코: 형기)</label><textarea rows="1" oninput="ED.bottom=this.value">' + esc(ED.bottom) + '</textarea></div>' +
      '<div class="mini"><label class="chk"><input type="checkbox" ' + (data.holidays[d] ? 'checked' : '') + ' onchange="toggleHol(this.checked)"> 공휴일</label><span class="hint" style="margin:0">공휴일이면 1호점 휴무 · 2호점 토요일 시간 기준</span></div></div>';

    // 출퇴근 기록 (관리자 수정)
    var works = (data.work || []).filter(function (x) { return x.date === d; });
    if (d <= data.today && works.length) {
      h += '<div class="box"><h4>출퇴근 기록 <small>시간을 고치고 저장 (비우면 삭제) · 휴게는 12:00-12:30 형식</small></h4>';
      works.forEach(function (x, k) {
        h += '<div class="att-row"><div class="who"><b style="color:' + staffInfo(x.name).color + '">' + esc(x.name) + '</b> <span class="pill ' + stClass(x.status) + '">' + esc(stLabel(x)) + '</span>' +
          '<small>' + esc(x.store) + ' · ' + (x.planned ? '예정 ' + x.start + '–' + x.end : '스케줄 없음') + '</small></div>' +
          '<input type="time" id="ain-' + k + '" value="' + (x.tin ? hhmm(toMin(x.tin)) : '') + '">' +
          '<input type="time" id="aout-' + k + '" value="' + (x.tout ? hhmm(toMin(x.tout)) : '') + '">' +
          '<button class="btn" onclick="saveAtt(' + k + ')">저장</button>' +
          '<input class="brk-in" id="abrk-' + k + '" placeholder="휴게 예) 12:00-12:30" value="' + esc(x.breaks || '') + '"></div>';
      });
      h += '</div>';
    }

    h += '<div class="panel-foot"><button class="btn" onclick="closeEd()">취소</button><button class="btn primary" id="save-day" onclick="saveDayNow()">적용</button></div>';
    $('panel').innerHTML = h;
  }

  function shiftRow(s, idx, store) {
    var names = S.data.staff.filter(function (x) { return x.status !== '퇴사' || x.name === s.name; });
    var def = defaultFor(store, ED.date, s.part);
    var custom = !def || def.start !== s.start || def.end !== s.end;
    var h = '<div class="shift' + (custom ? ' custom' : '') + '"><select onchange="setShift(' + idx + ',\'name\',this.value)">';
    if (!s.name) h += '<option value="">이름</option>';
    names.forEach(function (x) { h += '<option' + (x.name === s.name ? ' selected' : '') + '>' + esc(x.name) + '</option>'; });
    h += '</select><select onchange="setShift(' + idx + ',\'part\',this.value)">';
    partsOf(store).forEach(function (p) { h += '<option' + (p === s.part ? ' selected' : '') + '>' + esc(p) + '</option>'; });
    h += '</select><input type="time" step="300" value="' + (s.start ? hhmm(toMin(s.start)) : '') + '" onchange="setShift(' + idx + ',\'start\',this.value)">' +
      '<input type="time" step="300" value="' + (s.end ? hhmm(toMin(s.end)) : '') + '" onchange="setShift(' + idx + ',\'end\',this.value)">' +
      '<button class="x" onclick="delShift(' + idx + ')" aria-label="삭제">✕</button></div>';
    return h;
  }

  function addShift(store, part) {
    var def = defaultFor(store, ED.date, part);
    ED.shifts.push({ store: store, name: '', part: part, start: def ? def.start : '', end: def ? def.end : '', memo: '' });
    drawEditor();
  }
  function delShift(i) { ED.shifts.splice(i, 1); drawEditor(); }
  function setShift(i, k, v) {
    var s = ED.shifts[i];
    if (k === 'start' || k === 'end') { s[k] = v ? fmt(toMin(v)) : ''; }
    else s[k] = v;
    if (k === 'part') { var def = defaultFor(s.store, ED.date, v); if (def) { s.start = def.start; s.end = def.end; } }
    drawEditor();
  }
  function toggleHol(on) {
    var cur = ED.date;
    if (!commitEd(true)) { drawEditor(); return; }
    var name = on ? (prompt('공휴일 이름', '공휴일') || '공휴일') : '';
    withFlush(function () {
      api('toggleHoliday', S.pin, cur, name, S.ym).then(function (d) { setData(d); openDay(cur); toast(on ? '공휴일로 지정했어요' : '공휴일을 해제했어요'); })
        .catch(function (e) { toast(e.message, true); });
    });
  }

  /** 편집 중인 하루를 초안으로 담기 (시트에는 아직 안 올림) */
  function commitEd(keepOpen) {
    if (ED.shifts.some(function (s) { return !s.name; })) { toast('이름이 비어 있는 줄이 있어요', true); return false; }
    var bad = ED.shifts.filter(function (s) { var a = toMin(s.start), b = toMin(s.end); return a == null || b == null || b <= a; })[0];
    if (bad) { toast(bad.name + ' 님의 근무시간을 확인해주세요', true); return false; }
    var memos = [];
    var split = function (t, pos) { String(t || '').split('\n').forEach(function (x) { if (x.trim()) memos.push({ pos: pos, text: x.trim() }); }); };
    split(ED.top, '상단'); split(ED.bottom, '하단');
    Object.keys(ED.storeMemo).forEach(function (k) { split(ED.storeMemo[k], k); });
    S.drafts[ED.date] = { shifts: ED.shifts.map(function (x) { return { store: x.store, name: x.name, part: x.part, start: x.start, end: x.end, memo: x.memo || '' }; }), memos: memos };
    persistDrafts();
    applyDrafts(S.data);
    if (!keepOpen) closeEd();
    render();
    return true;
  }

  function saveDayNow() {
    if (commitEd(false)) toast('적용했어요 · 다 짜면 위의 [시트에 저장]을 눌러주세요');
  }

  function saveAtt(k) {
    var x = (S.data.work || []).filter(function (w) { return w.date === ED.date; })[k];
    var tin = $('ain-' + k).value, tout = $('aout-' + k).value, brk = $('abrk-' + k).value;
    api('saveAttendance', S.pin, ED.date, x.store, x.name, tin, tout, '', S.ym, brk).then(function (d) {
      setData(d); openDay(ED.date); toast(x.name + '님 출퇴근 기록을 고쳤어요');
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ---------------- 주 복사 ---------------- */
  function openCopy() {
    var d = S.data, opts = [];
    var start = addDays(d.from, -14), end = addDays(d.to, 28);
    for (var s = start; s <= end; s = addDays(s, 7)) opts.push(s);
    var label = function (s) { var e = addDays(s, 6); return (+s.slice(5, 7)) + '/' + (+s.slice(8)) + ' ~ ' + (+e.slice(5, 7)) + '/' + (+e.slice(8)); };
    var thisWeek = addDays(d.today, -dow(d.today));
    var h = '<div class="panel-head"><h2>주 단위 복사</h2><button class="round" onclick="closeEd()">✕</button></div><div class="box">' +
      '<div class="fld"><label>이 주의 스케줄을</label><select id="cp-from" class="mini">' + opts.map(function (s) { return '<option value="' + s + '"' + (s === thisWeek ? ' selected' : '') + '>' + label(s) + '</option>'; }).join('') + '</select></div>' +
      '<div class="fld"><label>이 주로 복사 (기존 스케줄은 덮어써요 · 메모는 복사 안 함)</label><select id="cp-to" class="mini">' + opts.map(function (s) { return '<option value="' + s + '"' + (s === addDays(thisWeek, 7) ? ' selected' : '') + '>' + label(s) + '</option>'; }).join('') + '</select></div>' +
      '<div class="hint">2주 단위로 짤 때는 두 번 복사하면 돼요. 복사한 뒤 바뀐 날만 고쳐주세요.</div></div>' +
      '<div class="panel-foot"><button class="btn" onclick="closeEd()">취소</button><button class="btn primary" id="cp-go" onclick="doCopy()">복사하기</button></div>';
    $('panel').innerHTML = h;
    Array.prototype.forEach.call($('panel').querySelectorAll('select'), function (el) { el.style.cssText = 'border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff;width:100%'; });
    $('overlay').classList.add('show');
  }
  function doCopy() {
    var f = $('cp-from').value, t = $('cp-to').value;
    if (f === t) return toast('같은 주예요', true);
    if (!confirm('복사할까요? 대상 주의 기존 스케줄은 지워져요.')) return;
    $('cp-go').disabled = true;
    withFlush(function () { return api('copyWeek', S.pin, f, t, S.ym).then(function (d) { closeEd(); setData(d); toast('주 스케줄을 복사했어요'); })
      .catch(function (e) { toast(e.message, true); $('cp-go').disabled = false; }); });
  }

  /* ---------------- 이동 · 출력 ---------------- */
  function go(n) { load(shiftYm(S.ym, n)); }
  function setTab(t) { S.tab = t; render(); }
  function setView(v) { S.view = v; render(); }

  function fitPrint() {
    // A4 세로 한 장에 들어가도록 전체 크기를 줄임 (인쇄 가능 영역 약 748×1077px)
    var w = document.querySelector('.wrap'); if (!w) return;
    document.body.classList.add('printing');
    w.style.zoom = '';
    var h = w.getBoundingClientRect().height;
    var z = Math.min(1, 1060 / h);
    w.style.zoom = z < 1 ? String(Math.floor(z * 100) / 100) : '';
  }
  function unfitPrint() { var w = document.querySelector('.wrap'); if (w) w.style.zoom = ''; document.body.classList.remove('printing'); }
  window.addEventListener('beforeprint', function () { if (S.tab === 'cal') fitPrint(); });
  window.addEventListener('afterprint', unfitPrint);

  function doPrint() {
    var prev = S.view;
    if (prev !== 'grid') { S.view = 'grid'; render(); }
    setTimeout(function () {
      fitPrint();
      window.print();
      unfitPrint();
      if (prev !== 'grid') { S.view = prev; render(); }
    }, 300);
  }

  function saveImage() {
    if (typeof html2canvas === 'undefined') return toast('이미지 기능을 불러오지 못했어요. 인쇄·PDF를 이용해주세요.', true);
    var prev = S.view;
    S.view = 'grid'; render();
    var root = document.querySelector('.wrap');
    var target = document.createElement('div');
    target.style.cssText = 'position:fixed;left:-99999px;top:0;width:1500px;background:#fff;padding:24px;';
    var head = document.querySelector('.head').cloneNode(true);
    var rules = document.querySelector('.rules').cloneNode(true);
    var noteSrc = document.querySelector('.rules').nextElementSibling;
    var note = noteSrc ? noteSrc.cloneNode(true) : null;
    var cal = $('capture').cloneNode(true);
    Array.prototype.forEach.call(head.querySelectorAll('.round, .no-print'), function (e) { e.remove(); });
    Array.prototype.forEach.call(cal.querySelectorAll('.hint, .att'), function (e) { e.remove(); });
    Array.prototype.forEach.call(cal.querySelectorAll('.cell'), function (e) { e.classList.remove('today', 'editable', 'dirty'); });
    cal.querySelector('.cal').style.minWidth = '0';
    [head, rules, note, cal].forEach(function (n) { if (n) { n.style.marginBottom = '12px'; target.appendChild(n); } });
    document.body.appendChild(target);
    toast('이미지 만드는 중…');
    html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
      target.remove();
      if (prev !== 'grid') { S.view = prev; render(); }
      var url = canvas.toDataURL('image/png');
      var file = '선선_스케줄_' + S.ym + '.png';
      $('panel').innerHTML = '<div class="panel-head"><h2>스케줄 이미지</h2><button class="round" onclick="closeEd()">✕</button></div>' +
        '<div class="box" style="text-align:center"><img src="' + url + '" style="width:100%;border-radius:8px;border:1px solid var(--line)" alt="스케줄 이미지">' +
        '<div class="hint">휴대폰은 이미지를 길게 눌러 저장하세요.</div></div>' +
        '<div class="panel-foot"><a class="btn primary" href="' + url + '" download="' + file + '">다운로드</a></div>';
      $('overlay').classList.add('show');
    }).catch(function () { target.remove(); toast('이미지를 만들지 못했어요. 인쇄·PDF를 이용해주세요.', true); });
  }

  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeEd(); });
  boot();
</script>
</body>
</html>
